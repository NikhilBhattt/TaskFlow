server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving at request time (instead of at startup)
  # means nginx still boots if the API container is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Forward API calls to the Express container (service name "app" in docker-compose.yml).
  location /api/ {
    set $api_upstream http://app:8000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
