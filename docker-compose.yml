# Starts the full TaskFlow stack: React client (nginx), API + in-process worker, MongoDB, Redis.
services:
  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: on-failure

  app:
    build:
      context: ./server
    ports:
      - "8000:8000"
    # Optional: supplies EMAIL_* and CLOUDINARY_* credentials if server/.env exists.
    # Requires Docker Compose v2.24+ for `required: false`.
    env_file:
      - path: ./server/.env
        required: false
    # These override anything in server/.env: inside the network, services are reached by
    # service name, never localhost.
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017/taskflow
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: on-failure

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mongo_data:
  redis_data:
